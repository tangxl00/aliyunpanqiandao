name: 阿里云盘每日签到

on:
  schedule:
    # 阿里云盘会在国内早高峰（北京时间 08:00-14:00）对海外 IP 丢包，GitHub 只能跑国内放行的时段
    # 安全窗口：凌晨 04:30（必通）/ 下午 15:30 / 16:30（晚高峰前）/ 晚上 22:30
    # 阿里云盘接口幂等，同一天重复跑只会提示"今日已签到"
    - cron: '30 7,8,14,20 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 执行签到
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
          SERVERCHAN_SCKEY: ${{ secrets.SERVERCHAN_SCKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: node scripts/checkin.mjs
