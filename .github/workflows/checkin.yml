name: 阿里云盘每日签到

on:
  schedule:
    # GitHub Actions cron 使用 UTC，北京时间 = UTC + 8
    # 一天跑 4 次（北京 15:30 / 16:30 / 22:30 / 次日 04:30）
    # 脚本自带每日状态：当天已签到过的账号不会再调用签到接口，每个推送渠道每天只推一次
    - cron: '30 7,8,14,20 * * *'
  workflow_dispatch:

# 同一时间只允许一个实例，避免两次运行同时读写状态
concurrency:
  group: aliyun-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 恢复上次运行留下的签到/推送状态（缓存只写一次，用 run_id 做 key 再靠 restore-keys 取最新）
      - name: 恢复签到状态
        uses: actions/cache/restore@v4
        with:
          path: .checkin-state.json
          key: checkin-state-${{ github.run_id }}
          restore-keys: |
            checkin-state-

      - name: 执行签到
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
          SERVERCHAN_SCKEY: ${{ secrets.SERVERCHAN_SCKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: node scripts/checkin.mjs

      # 保证状态文件存在，否则 cache save 会因路径校验失败
      - name: 确保状态文件存在
        if: always()
        run: touch .checkin-state.json

      - name: 保存签到状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .checkin-state.json
          key: checkin-state-${{ github.run_id }}
