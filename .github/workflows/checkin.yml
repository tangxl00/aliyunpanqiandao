name: 阿里云盘每日签到

on:
  schedule:
  schedule:
    # 一天 4 次错开跑，GitHub 免费 cron 是尽力而为，多几个机会就不会被跳过
    # UTC 00:30=BJ 08:30 / UTC 08:30=BJ 16:30 / UTC 14:30=BJ 22:30 / UTC 20:30=次日 BJ 04:30
    # 阿里云盘签到接口幂等，同一天重复跑只会提示"今日已签到"，不会重复计数
    - cron: '30 0,8,14,20 * * *'
    # 阿里云盘签到接口本身幂等，同一天重复跑不会重复计数，只会提示 "今日已签到"
    - cron: '30 0,8,14,20 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 执行签到
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
          SERVERCHAN_SCKEY: ${{ secrets.SERVERCHAN_SCKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: node scripts/checkin.mjs
