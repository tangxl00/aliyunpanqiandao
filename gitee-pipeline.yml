version: '1.0'
name: aliyundrive-checkin
displayName: 阿里云盘每日签到
triggers:
  trigger: auto
  push:
    branches:
      prefix:
        - master
  schedule:
    # 北京时间
    - cron: '0 30 8 * * ?'
    - cron: '0 30 16 * * ?'
    - cron: '0 30 22 * * ?'

stages:
  - stage:
    name: checkin
    displayName: 签到
    steps:
      - step: build@nodejs
        name: node_build
        displayName: 检出代码并执行签到
        # Gitee 官方支持 8/10/12/14/15，先让它起个 Ubuntu 环境，commands 里自己装 Node 22
        nodeVersion: 15.12.0
        commands:
          - git checkout master
          - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          - apt-get install -y nodejs
          - node --version
          - node scripts/checkin.mjs
